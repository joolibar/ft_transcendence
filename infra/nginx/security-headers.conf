# Security headers for the web app responses.

# Only ever use HTTPS for this site, for one year.
add_header Strict-Transport-Security "max-age=31536000" always;
# Do not guess file types: a file is only what its Content-Type says.
add_header X-Content-Type-Options "nosniff" always;
# Do not let other sites embed Miga in a frame (clickjacking).
add_header X-Frame-Options "DENY" always;
# Send only the origin, not the full URL, when following links to other sites.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Browser features: location may be used by Miga itself; camera and microphone never.
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
