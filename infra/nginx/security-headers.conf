# Security headers for the web app responses.

# Only ever use HTTPS for this site, for one year.
add_header Strict-Transport-Security "max-age=31536000" always;
# Do not guess file types: a file is only what its Content-Type says.
add_header X-Content-Type-Options "nosniff" always;
# Do not let other sites embed Miga in a frame (clickjacking).
add_header X-Frame-Options "DENY" always;
# Send only the origin, not the full URL, when following links to other sites.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Browser features: location may be used by Miga itself; camera and microphone never.
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
# Content Security Policy: the browser only loads code, styles, images and
# connections from Miga itself. It is the main defence against cross-site
# scripting (XSS): even if an attacker injects HTML, the browser refuses to run
# scripts that do not come from our own files. To allow an external service
# (for example images from a places API), add its origin to the matching
# directive and explain it in the PR. See docs/architecture.md.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
# Isolate Miga's window from pages it opens or that open it (cross-window attacks).
add_header Cross-Origin-Opener-Policy "same-origin" always;
