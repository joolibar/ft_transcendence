name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the jobs only read the code.
permissions:
  contents: read

# Checks that the code works. Each job shows up as its own check in the pull
# request, and all of them always run because shared/ affects the backend and the frontend.
# Pull request rules (title, branch, authors) live in pr-conventions.yml.
jobs:
  quality:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint

  api:
    name: API typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@miga/backend..." build

  web:
    name: Web typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@miga/frontend..." build

  test:
    name: Tests
    runs-on: ubuntu-latest
    # A throwaway PostgreSQL so API tests run against a real database.
    services:
      postgres:
        image: postgres:17.11-trixie
        env:
          POSTGRES_USER: miga
          POSTGRES_PASSWORD: miga
          POSTGRES_DB: miga_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miga -d miga_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://miga:miga@localhost:5432/miga_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage

  stack:
    name: Stack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The command the evaluation runs: creates .env from .env.example, builds
      # the images and starts db, api and web.
      - run: make
      # Waits until every service passes its Docker health check.
      - run: docker compose up --detach --wait --wait-timeout 180
      - name: Check the app over HTTPS
        run: |
          health=$(curl --fail --silent --show-error --insecure https://localhost:8443/api/health)
          echo "$health"
          echo "$health" | grep -q '"status":"ok"'
          echo "$health" | grep -q '"database":"up"'
          curl --fail --silent --show-error --insecure --output /dev/null https://localhost:8443/
          curl --silent --show-error --insecure --head https://localhost:8443/ | grep -qi '^strict-transport-security:'
      - name: Show the logs
        if: failure()
        run: docker compose logs
      - run: make clean
        if: always()
