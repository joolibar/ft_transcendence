name: Feature request
description: Something new to build or improve in the product
labels: [feature]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be possible when this is done, and for whom?
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: A checklist the reviewer can verify.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Design / technical notes
      description: Figma links, affected modules (api, web, shared), open questions.
