name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Screenshots, logs or console errors
  - type: textarea
    id: regression
    attributes:
      label: Regression test
      description: The fix comes with a test that fails before it and passes after, so the bug cannot come back unnoticed.
      value: |
        - [ ] A test reproduces the bug and passes with the fix.
